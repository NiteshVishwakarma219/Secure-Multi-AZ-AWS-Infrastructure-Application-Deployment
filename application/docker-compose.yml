version: "3.9"

services:
  frontend:
    image: cloudwithnitesh/nexops-frontend:1.0.0
    container_name: eems-frontend
    restart: unless-stopped
    ports:
      - "80:80"

  backend:
    image: cloudwithnitesh/nexops-backend:1.0.0
    container_name: eems-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
